[project]
name = "privacy-finance-agent"
version = "1.0.0"
description = "Privacy-first personal finance insight agent"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "streamlit>=1.30",
    "plotly>=5.18",
    "requests>=2.31",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]